<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">Four scenes from Lithos</title><desc id="desc">Four illustrated chapter cards for the project's main themes.</desc><rect width="1200" height="380" fill="#050407"/><path d="M40 40H1160M40 347H1160" stroke="#cdc8d8" stroke-opacity=".8"/><path d="M320 40V347" stroke="#cdc8d8" stroke-opacity=".55"/><text x="55" y="67" fill="#cdc8d8" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 01</text><circle cx="180" cy="173" r="68" fill="none" stroke="#9d6bff" stroke-opacity=".7" stroke-width="2"/><circle cx="180" cy="173" r="46" fill="none" stroke="#cdc8d8" stroke-opacity=".65"/><path d="M180 106V240M113 173H247" stroke="#9d6bff" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="180" cy="173" r="17" fill="#9d6bff"/> --><text x="180" y="191" text-anchor="middle" fill="#9d6bff" font-family="Georgia,serif" font-size="54" font-style="italic">A</text><text x="55" y="281" fill="#efeaf6" font-family="Georgia,serif" font-style="italic" font-size="22">Amethyst</text><text x="55" y="307" fill="#cdc8d8" font-family="Arial,sans-serif" font-size="11">A geode opens a hidden room.</text><path d="M600 40V347" stroke="#cdc8d8" stroke-opacity=".55"/><text x="335" y="67" fill="#cdc8d8" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 02</text><circle cx="460" cy="173" r="68" fill="none" stroke="#9d6bff" stroke-opacity=".7" stroke-width="2"/><circle cx="460" cy="173" r="46" fill="none" stroke="#cdc8d8" stroke-opacity=".65"/><path d="M460 106V240M393 173H527" stroke="#9d6bff" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="460" cy="173" r="17" fill="#9d6bff"/> --><text x="460" y="191" text-anchor="middle" fill="#9d6bff" font-family="Georgia,serif" font-size="54" font-style="italic">R</text><text x="335" y="281" fill="#efeaf6" font-family="Georgia,serif" font-style="italic" font-size="22">Rock crystal</text><text x="335" y="307" fill="#cdc8d8" font-family="Arial,sans-serif" font-size="11">Clear geometry catches the</text><text x="335" y="325" fill="#cdc8d8" font-family="Arial,sans-serif" font-size="11">light.</text><path d="M880 40V347" stroke="#cdc8d8" stroke-opacity=".55"/><text x="615" y="67" fill="#cdc8d8" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 03</text><circle cx="740" cy="173" r="68" fill="none" stroke="#9d6bff" stroke-opacity=".7" stroke-width="2"/><circle cx="740" cy="173" r="46" fill="none" stroke="#cdc8d8" stroke-opacity=".65"/><path d="M740 106V240M673 173H807" stroke="#9d6bff" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="740" cy="173" r="17" fill="#9d6bff"/> --><text x="740" y="191" text-anchor="middle" fill="#9d6bff" font-family="Georgia,serif" font-size="54" font-style="italic">P</text><text x="615" y="281" fill="#efeaf6" font-family="Georgia,serif" font-style="italic" font-size="22">Pyrite</text><text x="615" y="307" fill="#cdc8d8" font-family="Arial,sans-serif" font-size="11">Cubes form without a ruler.</text><path d="M1160 40V347" stroke="#cdc8d8" stroke-opacity=".55"/><text x="895" y="67" fill="#cdc8d8" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 04</text><circle cx="1020" cy="173" r="68" fill="none" stroke="#9d6bff" stroke-opacity=".7" stroke-width="2"/><circle cx="1020" cy="173" r="46" fill="none" stroke="#cdc8d8" stroke-opacity=".65"/><path d="M1020 106V240M953 173H1087" stroke="#9d6bff" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="1020" cy="173" r="17" fill="#9d6bff"/> --><text x="1020" y="191" text-anchor="middle" fill="#9d6bff" font-family="Georgia,serif" font-size="54" font-style="italic">A</text><text x="895" y="281" fill="#efeaf6" font-family="Georgia,serif" font-style="italic" font-size="22">Ammonite</text><text x="895" y="307" fill="#cdc8d8" font-family="Arial,sans-serif" font-size="11">A fossil keeps the spiral.</text></svg>